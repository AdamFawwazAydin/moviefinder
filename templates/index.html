<!DOCTYPE html>
<html>
<head>
    <title>Movie Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #121212; color: white; }
        .card { background-color: #1e1e1e; border: none; transition: 0.3s; }
        .card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .form-control { background-color: #2a2a2a; color: white; border: none; }
        .btn-primary { background-color: #ff3c3c; border: none; }
        img { height: 350px; object-fit: cover; }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body class="container mt-4">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎬 Movie Finder</span>
        </div>
    </nav>

    <!-- SEARCH -->
    <form method="POST" class="d-flex mb-3" onsubmit="showLoading()">
        <input type="text" name="query" class="form-control" placeholder="Cari film..." required>
        <button class="btn btn-primary ms-2">Cari</button>
    </form>

    <!-- LOADING -->
    <div id="loading">
        <div class="spinner-border text-light"></div>
        <p>Loading...</p>
    </div>

    {% if error %}
        <p class="text-danger text-center">{{ error }}</p>
    {% endif %}

    <!-- MOVIE LIST -->
    <div class="row">
        {% for movie in movies %}
        <div class="col-md-3 mb-4">
            <div class="card">
                <a href="/detail/{{ movie.imdbID }}" style="text-decoration:none; color:white;">
                    <img src="{{ movie.Poster }}" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>{{ movie.Title }}</h5>
                        <p>{{ movie.Year }}</p>
                    </div>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        function showLoading() {
            document.getElementById("loading").style.display = "block";
        }
    </script>

</body>
</html>
